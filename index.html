<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>习惯打卡</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap');

  :root{
    --paper:#FAFAF8;
    --surface:#FFFFFF;
    --surface-2:#F3F4F1;
    --hover:#F7F8F5;
    --ink:#23282F;
    --muted:#8A93A0;
    --hairline:#E7E9E5;
    --accent:#2E6B52;
    --accent-strong:#224F3D;
    --accent-tint:#E9F1EB;
    --on-accent:#FCFEFC;
    --radius:18px;
    --shadow:0 1px 2px rgba(30,40,60,.05), 0 10px 30px rgba(30,40,60,.05);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:28px 18px 64px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/></svg>");
    background-size:140px 140px;
  }
  .wrap{ max-width:600px; margin:0 auto; position:relative; z-index:1; }

  /* ---------- header ---------- */
  header{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; }
  .greet{ font-size:13.5px; color:var(--muted); letter-spacing:.02em; }
  h1{ font-size:24px; font-weight:700; margin-top:6px; letter-spacing:-.01em; color:var(--ink); }
  .date-chip{
    font-size:13px; color:var(--ink); background:var(--surface); padding:8px 14px;
    border:1px solid var(--hairline); border-radius:999px; font-weight:600; white-space:nowrap;
    box-shadow:0 1px 2px rgba(30,40,60,.04);
  }

  /* ---------- progress card ---------- */
  .progress{
    background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius);
    padding:22px 22px 20px; box-shadow:var(--shadow); margin-bottom:16px; position:relative; overflow:hidden;
  }
  .progress::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); }
  .progress-top{ display:flex; align-items:baseline; gap:10px; }
  .progress-label{ font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.04em; }
  .progress-count{ font-family:"Sora",-apple-system,BlinkMacSystemFont,sans-serif; font-size:15px; color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums; }
  .progress-count b{ font-size:30px; font-weight:700; color:var(--accent-strong); margin-right:3px; letter-spacing:-.02em; }
  .bar{ height:6px; background:var(--surface-2); border-radius:999px; margin-top:18px; overflow:hidden; }
  .bar i{ display:block; height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent-strong)); transition:width .6s cubic-bezier(.4,0,.2,1); }
  .done-msg{ margin-top:12px; font-size:13.5px; color:var(--muted); font-weight:500; min-height:20px; }

  /* ---------- habit list ---------- */
  .card{ background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); box-shadow:var(--shadow); padding:4px 0; }
  .habit{
    display:flex; align-items:center; gap:14px; padding:15px 18px;
    border-bottom:1px solid var(--hairline); cursor:pointer; position:relative;
    transition:background .15s;
  }
  .habit:last-child{ border-bottom:none; }
  .habit:hover{ background:var(--hover); }
  .habit.done .name{ color:var(--muted); text-decoration:line-through; }
  .emoji{
    width:42px; height:42px; min-width:42px; border-radius:12px; display:flex;
    align-items:center; justify-content:center; font-size:22px;
    background:var(--surface-2); border:1px solid var(--hairline);
  }
  .habit.done .emoji{ background:var(--accent-tint); border-color:#DCE9E0; }
  .info{ flex:1; min-width:0; }
  .name{ font-size:16px; font-weight:600; letter-spacing:-.01em; color:var(--ink); transition:color .2s; word-break:break-all; }
  .sub{ font-family:"Sora",-apple-system,BlinkMacSystemFont,sans-serif; font-size:12px; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .check{
    width:30px; height:30px; min-width:30px; border-radius:50%;
    border:1.5px solid #CFD4D0; display:flex; align-items:center; justify-content:center;
    transition:all .2s; background:var(--surface);
  }
  .habit.done .check{ border-color:var(--accent); background:var(--accent); }
  .check svg{ width:14px; height:14px; stroke:var(--on-accent); stroke-width:3.2; fill:none;
    stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .3s .05s; }
  .habit.done .check svg{ stroke-dashoffset:0; }
  .del{
    width:28px; height:28px; border-radius:8px; border:none; background:transparent; cursor:pointer;
    color:#B8BEC6; font-size:15px; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:all .15s; position:absolute; right:8px; top:6px;
  }
  .habit:hover .del{ opacity:1; }
  .del:hover{ background:#FBEDEC; color:#C2453C; }

  /* ---------- empty ---------- */
  .empty{ text-align:center; padding:38px 20px 32px; color:var(--muted); }
  .empty .big{ font-size:42px; margin-bottom:12px; }
  .empty p{ font-size:14px; line-height:1.7; }

  /* ---------- week strip ---------- */
  .week{ margin-top:16px; background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
  .week h3{ font-size:12.5px; color:var(--muted); font-weight:600; letter-spacing:.06em; margin-bottom:14px; }
  .week-days{ display:flex; justify-content:space-between; }
  .day{ text-align:center; flex:1; }
  .day .dow{ font-size:11px; color:var(--muted); margin-bottom:8px; }
  .day.today .dow{ color:var(--accent-strong); font-weight:700; }
  .ring{ width:34px; height:34px; margin:0 auto; border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), #ECEEE9 0);
    display:flex; align-items:center; justify-content:center; position:relative; }
  .ring::before{ content:""; position:absolute; inset:4px; background:var(--surface); border-radius:50%; }
  .ring span{ position:relative; font-family:"Sora",-apple-system,sans-serif; font-size:10px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  .day.today .ring{ box-shadow:0 0 0 2px var(--surface), 0 0 0 4px rgba(46,107,82,.25); }

  /* ---------- add form ---------- */
  .add{ margin-top:16px; background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; }
  .add h3{ font-size:12.5px; color:var(--muted); font-weight:600; letter-spacing:.06em; margin-bottom:14px; }
  .row{ display:flex; gap:10px; }
  .row input{
    flex:1; border:1px solid var(--hairline); border-radius:12px; padding:12px 14px; font-size:15px;
    outline:none; background:var(--surface); color:var(--ink); transition:border-color .2s, box-shadow .2s; min-width:0;
  }
  .row input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(46,107,82,.14); }
  .row input::placeholder{ color:#A9B0B8; }
  .row button{
    border:none; background:var(--accent); color:var(--on-accent);
    font-size:15px; font-weight:600; padding:0 22px; border-radius:12px; cursor:pointer;
    transition:background .15s, transform .1s; box-shadow:0 6px 14px rgba(46,107,82,.22);
  }
  .row button:hover{ background:var(--accent-strong); }
  .row button:active{ transform:scale(.98); }
  .emojis{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .emojis button{
    border:1px solid transparent; background:var(--surface-2); border-radius:10px; width:38px; height:38px;
    font-size:19px; cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center;
  }
  .emojis button:hover{ border-color:#D7DCD6; }
  .emojis button.sel{ border-color:var(--accent); background:var(--accent-tint); transform:scale(1.06); }
  .hint{ font-size:12px; color:var(--muted); margin-top:12px; line-height:1.6; }

  footer{ text-align:center; margin-top:24px; font-size:12px; color:#A9B0B8; }

  .row button:focus-visible, .emojis button:focus-visible, .del:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  /* ---------- 查看某天打卡详情 ---------- */
  .day{ cursor:pointer; }
  .day:hover{ opacity:.8; }
  .day:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:10px; }
  .overlay{
    position:fixed; inset:0; background:rgba(30,40,60,.32); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .overlay[hidden]{ display:none; }
  .sheet{
    background:var(--surface); border:1px solid var(--hairline); border-radius:20px;
    box-shadow:0 24px 60px rgba(30,40,60,.18); width:100%; max-width:480px; max-height:78vh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px 12px; border-bottom:1px solid var(--hairline); }
  .sheet-head h2{ font-size:17px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }
  .sheet-close{ width:32px; height:32px; border-radius:10px; border:none; background:var(--surface-2); color:var(--muted); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .sheet-close:hover{ background:#E9EBE7; color:var(--ink); }
  .sheet-body{ padding:6px 6px 12px; overflow:auto; }
  .day-item{ display:flex; align-items:center; gap:14px; padding:12px 14px; border-bottom:1px solid var(--hairline); }
  .day-item:last-child{ border-bottom:none; }
  .day-item .emoji{ width:40px; height:40px; min-width:40px; border-radius:12px; font-size:20px; background:var(--surface-2); border:1px solid var(--hairline); display:flex; align-items:center; justify-content:center; }
  .day-item.done .emoji{ background:var(--accent-tint); border-color:#DCE9E0; }
  .day-item .name{ font-size:15px; font-weight:600; color:var(--ink); }
  .day-item.done .name{ color:var(--accent-strong); }
  .day-item:not(.done) .name{ color:var(--muted); }
  .day-check{ width:28px; height:28px; min-width:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; }
  .day-item.done .day-check{ background:var(--accent); color:var(--on-accent); }
  .day-item:not(.done) .day-check{ background:var(--surface-2); color:#B0B7BD; }
  .day-empty{ text-align:center; padding:30px 20px; color:var(--muted); font-size:13px; }
  body.modal-open{ overflow:hidden; }


  /* ---------- 月历 ---------- */
  .week-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .week-head h3{ font-size:12.5px; color:var(--muted); font-weight:600; letter-spacing:.06em; margin:0; }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  .cal-btn{ width:28px; height:28px; border-radius:9px; border:1px solid var(--hairline); background:var(--surface); color:var(--muted); font-size:16px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .cal-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .cal-title{ font-family:"Sora",sans-serif; font-size:13px; font-weight:700; color:var(--ink); min-width:56px; text-align:center; font-variant-numeric:tabular-nums; }
  .cal-dow{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:2px; }
  .cal-dow span{ text-align:center; font-size:11px; color:var(--muted); padding:4px 0; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-blank{ aspect-ratio:1; }
  .cal-day{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; aspect-ratio:1; border-radius:12px; background:var(--surface-2); cursor:pointer; transition:background .15s, transform .1s; }
  .cal-day .num{ font-family:"Sora",sans-serif; font-size:13px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .cal-day .dot{ width:7px; height:7px; border-radius:50%; background:transparent; }
  .cal-day.has .dot{ background:#B9C6BF; }
  .cal-day.all .dot{ background:var(--accent); }
  .cal-day.today{ background:var(--accent-tint); border:1px solid var(--accent); }
  .cal-day.today .num{ color:var(--accent-strong); }
  .cal-day:hover:not(.future){ background:#ECEEE9; }
  .cal-day.future{ background:transparent; cursor:default; opacity:.4; }
  /* ---------- 连续坚持 ---------- */
  .progress-side{ display:flex; align-items:center; gap:10px; margin-left:auto; }
  .progress-side .progress-count{ margin-left:0; }
  .streak{ font-size:12.5px; color:var(--muted); background:var(--surface-2); border-radius:999px; padding:4px 10px; font-weight:600; white-space:nowrap; }
  /* ---------- 详情可点击 ---------- */
  .day-item{ cursor:pointer; }
  .day-item:hover{ background:var(--hover); }

</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="greet" id="greet"></div>
      <h1>习惯打卡</h1>
    </div>
    <div class="date-chip" id="dateChip"></div>
  </header>

  <section class="progress">
        <div class="progress-top">
      <span class="progress-label">今日进度</span>
      <div class="progress-side">
        <span class="streak" id="streak"></span>
        <span class="progress-count"><b id="doneNum">0</b>/<span id="totalNum">0</span> 项</span>
      </div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="done-msg" id="doneMsg"></div>
  </section>

  <section class="card" id="list"></section>

    <section class="week">
    <div class="week-head">
      <h3>本月日历</h3>
      <div class="cal-nav">
        <button class="cal-btn" id="calPrev" aria-label="上个月">‹</button>
        <span class="cal-title" id="calTitle"></span>
        <button class="cal-btn" id="calNext" aria-label="下个月">›</button>
      </div>
    </div>
    <div class="cal-dow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="week-days cal-grid" id="weekDays"></div>
  </section>

  <section class="add">
    <h3>＋ 添加新习惯</h3>
    <form class="row" id="addForm" autocomplete="off">
      <input id="habitName" maxlength="20" placeholder="想坚持什么？例如：喝水" required>
      <button type="submit">添加</button>
    </form>
    <div class="emojis" id="emojiRow"></div>
    <div class="hint">💡 每天点击习惯即可完成打卡；鼠标悬停右上角可删除习惯。</div>
  </section>

  <footer>数据保存在本机浏览器中</footer>
</div>


<div class="overlay" id="dayModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dayTitle">
    <div class="sheet-head">
      <h2 id="dayTitle"></h2>
      <button class="sheet-close" id="dayClose" aria-label="关闭">&times;</button>
    </div>
    <div class="sheet-body" id="dayList"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var LS_HABITS = "habitTracker.habits";
  var LS_RECORDS = "habitTracker.records";

  var EMOJIS = ["💧","🏃","📖","🥗","💪","🧘","😴","🌅","✍️","🎯","🎸","💊","📵","🚭","💰"];
  var selectedEmoji = "💧";

  /* ---------- helpers ---------- */
  function todayKey(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function pad(n){ return (n<10?"0":"") + n; }
  function load(key, fallback){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  /* ---------- data ---------- */
  var habits = load(LS_HABITS, []);      // [{id,name,emoji,created}]
  var records = load(LS_RECORDS, {});    // { "2026-09-03": { habitId:true } }
  var KEY = todayKey();

  function persist(){ save(LS_HABITS, habits); save(LS_RECORDS, records); }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function doneCount(dayKey){
    var r = records[dayKey] || {};
    var n = 0;
    habits.forEach(function(h){ if(r[h.id]) n++; });
    return n;
  }
  function isDone(id){ return !!(records[KEY] && records[KEY][id]); }

  /* ---------- dom ---------- */
  var $ = function(s){ return document.querySelector(s); };
  var listEl = $("#list"), barFill = $("#barFill"), doneNum = $("#doneNum"),
      totalNum = $("#totalNum"), doneMsg = $("#doneMsg"), weekDays = $("#weekDays");

  function renderHeader(){
    var now = new Date(), h = now.getHours();
    var g = h<5 ? "夜深了" : h<11 ? "早上好" : h<13 ? "中午好" : h<18 ? "下午好" : "晚上好";
    $("#greet").textContent = g + "，今天也要加油 ✨";
    var weeks = ["日","一","二","三","四","五","六"];
    $("#dateChip").textContent = (now.getMonth()+1) + "月" + now.getDate() + "日 · 周" + weeks[now.getDay()];
  }

  function renderList(){
    if(!habits.length){
      listEl.innerHTML =
        '<div class="empty"><div class="big">🌱</div>' +
        '<p>还没有习惯<br>在下方添加第一个想坚持的习惯吧</p></div>';
      return;
    }
    var html = "";
    habits.forEach(function(h){
      var done = isDone(h.id);
      var created = new Date(h.created);
      var days = Math.max(1, Math.floor((Date.now() - h.created)/86400000)+1);
      html +=
        '<div class="habit' + (done?" done":"") + '" data-id="' + h.id + '">' +
          '<button class="del" data-del="' + h.id + '" title="删除">✕</button>' +
          '<div class="emoji">' + h.emoji + '</div>' +
          '<div class="info"><div class="name">' + esc(h.name) + '</div>' +
          '<div class="sub">已坚持 ' + days + ' 天</div></div>' +
          '<div class="check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>' +
        '</div>';
    });
    listEl.innerHTML = html;
  }

  function renderProgress(){
    var total = habits.length, done = doneCount(KEY);
    var pct = total ? Math.round(done/total*100) : 0;
    doneNum.textContent = done;
    totalNum.textContent = total;
    barFill.style.width = pct + "%";
    if(!total) doneMsg.textContent = "添加习惯后开始打卡吧";
    else if(done===0) doneMsg.textContent = "万事开头难，先完成第一项 💪";
    else if(done===total) doneMsg.textContent = "🎉 全部完成！今天太棒了！";
    else doneMsg.textContent = "已完成 " + done + " 项，还剩 " + (total-done) + " 项，继续加油！";
  }

  var viewYear = new Date().getFullYear(), viewMonth = new Date().getMonth();

  function todayKy(){
    var d = new Date();
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function calcStreak(){
    var d = new Date();
    var streak = 0;
    for(var i=0;i<3660;i++){
      var key = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
      var rec = records[key] || {};
      var done = habits.some(function(h){ return rec[h.id]; });
      if(done){ streak++; }
      else if(i===0){}
      else { break; }
      d.setDate(d.getDate()-1);
    }
    return streak;
  }
  function renderStreak(){
    var el = document.getElementById("streak");
    if(el){ el.textContent = "🔥 连续 " + calcStreak() + " 天"; }
  }
  function renderCalendar(){
    var todayK = todayKy();
    var todayD = new Date();
    var first = new Date(viewYear, viewMonth, 1);
    var daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    var lead = (first.getDay()+6)%7;
    var monthTotal = habits.length;
    var out = "";
    for(var k=0;k<lead;k++){ out += '<div class="cal-blank"></div>'; }
    for(var day=1; day<=daysInMonth; day++){
      var d = new Date(viewYear, viewMonth, day);
      var key = viewYear+"-"+pad(viewMonth+1)+"-"+pad(day);
      var isT = key===todayK;
      var future = d.getTime() > todayD.getTime();
      var done = monthTotal ? doneCount(key) : 0;
      var allDone = monthTotal>0 && done===monthTotal;
      if(future){
        out += '<div class="cal-day future"><span class="num">'+day+'</span></div>';
      } else {
        out += '<div class="day cal-day' + (isT?" today":"") + (allDone?" all":"") + (done>0?" has":"") + '" data-d="' + key + '" role="button" tabindex="0" aria-label="查看' + (viewMonth+1) + '月' + day + '日打卡详情">' +
               '<span class="num">'+day+'</span>' +
               '<span class="dot"></span>' +
               '</div>';
      }
    }
    var tail = (7 - ((lead+daysInMonth)%7)) % 7;
    for(var m=0;m<tail;m++){ out += '<div class="cal-blank"></div>'; }
    weekDays.innerHTML = out;
    var tEl = document.getElementById("calTitle");
    if(tEl){ tEl.textContent = viewYear + "年" + (viewMonth+1) + "月"; }
  }
  function esc(s){
    return s.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function render(){ renderHeader(); renderList(); renderProgress(); renderStreak(); renderCalendar(); }

  /* ---------- interactions ---------- */
  listEl.addEventListener("click", function(e){
    var delBtn = e.target.closest(".del");
    if(delBtn){
      e.stopPropagation();
      var h = habits.find(function(x){ return x.id===delBtn.dataset.del; });
      if(h && confirm("删除习惯「" + h.name + "」？历史记录会保留。")){
        habits = habits.filter(function(x){ return x.id!==h.id; });
        persist(); render();
      }
      return;
    }
    var row = e.target.closest(".habit");
    if(!row) return;
    var id = row.dataset.id;
    records[KEY] = records[KEY] || {};
    if(records[KEY][id]){ delete records[KEY][id]; }
    else{ records[KEY][id] = true; }
    persist(); render();
  });

  $("#addForm").addEventListener("submit", function(e){
    e.preventDefault();
    var inp = $("#habitName");
    var name = inp.value.trim();
    if(!name) return;
    var emoji = selectedEmoji;
    // 如果用户自己输入了开头的 emoji，就使用它
    var m = name.match(/^(\p{Extended_Pictographic})\s*(.*)$/u);
    if(m){ emoji = m[1]; name = m[2].trim() || "新习惯"; }
    habits.push({ id:uid(), name:name, emoji:emoji, created:Date.now() });
    inp.value = "";
    selectedEmoji = "💧";
    updateEmojiUI();
    persist(); render();
    inp.focus();
  });

  /* emoji picker */
  var emojiRow = $("#emojiRow");
  function buildEmojiUI(){
    EMOJIS.forEach(function(em){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = em; b.dataset.em = em;
      emojiRow.appendChild(b);
    });
    updateEmojiUI();
  }
  function updateEmojiUI(){
    Array.prototype.forEach.call(emojiRow.children, function(b){
      b.classList.toggle("sel", b.dataset.em===selectedEmoji);
    });
  }
  emojiRow.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(b){ selectedEmoji = b.dataset.em; updateEmojiUI(); }
  });

  
  /* ---------- 查看某天打卡详情 ---------- */
  /* ---------- 查看 / 补打卡某天详情 ---------- */
  var overlay = document.getElementById("dayModal");
  var dayTitle = document.getElementById("dayTitle");
  var dayList = document.getElementById("dayList");
  var dayClose = document.getElementById("dayClose");
  var WEEKL = ["日","一","二","三","四","五","六"];
  var currentDayKey = null;

  function renderDayList(){
    var key = currentDayKey;
    if(!key) return;
    var d = new Date(key.replace(/-/g,"/"));
    var label = (d.getMonth()+1) + "月" + d.getDate() + "日 · 周" + WEEKL[d.getDay()];
    dayTitle.textContent = label + " 打卡详情";
    var rec = records[key] || {};
    var cutoff = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() + 86400000;
    var items = habits.filter(function(h){ return h.created < cutoff; });
    if(!items.length){
      dayList.innerHTML = '<p class="day-empty">这一天还没有习惯记录</p>';
      return;
    }
    var dh = "";
    items.forEach(function(h){
      var done = !!rec[h.id];
      dh +=
        '<div class="day-item' + (done?" done":"") + '" data-id="' + h.id + '">' +
          '<div class="emoji">' + h.emoji + '</div>' +
          '<div class="info"><div class="name">' + esc(h.name) + '</div></div>' +
          '<div class="day-check">' + (done ? "✓" : "—") + '</div>' +
        '</div>';
    });
    dayList.innerHTML = dh;
  }
  function openDay(key){
    currentDayKey = key;
    renderDayList();
    overlay.hidden = false;
    document.body.classList.add("modal-open");
    dayClose.focus();
  }
  function closeDay(){
    overlay.hidden = true;
    document.body.classList.remove("modal-open");
  }
  function toggleDayItem(id){
    if(!currentDayKey) return;
    records[currentDayKey] = records[currentDayKey] || {};
    if(records[currentDayKey][id]){ delete records[currentDayKey][id]; }
    else{ records[currentDayKey][id] = true; }
    persist();
    renderDayList();
    render();
  }
  dayList.addEventListener("click", function(e){
    var item = e.target.closest(".day-item");
    if(!item) return;
    toggleDayItem(item.dataset.id);
  });
  weekDays.addEventListener("click", function(e){
    var day = e.target.closest(".day");
    if(!day) return;
    openDay(day.dataset.d);
  });
  weekDays.addEventListener("keydown", function(e){
    if(e.key!=="Enter" && e.key!==" ") return;
    var day = e.target.closest(".day");
    if(!day) return;
    e.preventDefault();
    openDay(day.dataset.d);
  });
  dayClose.addEventListener("click", closeDay);
  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeDay(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !overlay.hidden) closeDay(); });
  var calPrev = document.getElementById("calPrev");
  var calNext = document.getElementById("calNext");
  if(calPrev){ calPrev.addEventListener("click", function(){ viewMonth--; if(viewMonth<0){ viewMonth=11; viewYear--; } renderCalendar(); }); }
  if(calNext){ calNext.addEventListener("click", function(){ viewMonth++; if(viewMonth>11){ viewMonth=0; viewYear++; } renderCalendar(); }); }

  /* kick off */
  buildEmojiUI();
  render();
})();
</script>
</body>
</html>
